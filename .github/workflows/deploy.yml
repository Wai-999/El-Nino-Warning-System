name: Validate, refresh data, and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4,10,16,22 * * *"
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Refresh source data; retain dated prior datasets on failure
        if: github.event_name != 'pull_request'
        run: npm run data:refresh
      - run: npm run data:validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save reviewed source snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/current.json public/data/archive.json public/data/ingestion-health.json public/data/operational.json scripts/cache/climatology.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh sourced climate and weather snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  ingestion-health:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Surface source failures after publishing the safe fallback
        run: node -e "const x=require('./public/data/ingestion-health.json'); const o=require('./public/data/operational.json'); if(!x.ok || Object.values(o.health).some(h=>!h.ok))throw Error('Source refresh failed; a dated fallback was deployed. Inspect provider health.');"
